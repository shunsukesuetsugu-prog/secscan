name: Publish to PyPI

# A1: this workflow publishes secscan to PyPI via the OpenID
# Connect "Trusted Publisher" flow — no PyPI API token lives on
# GitHub. The job is gated on the ``release`` event so it cannot
# fire accidentally from a branch push; cutting a GitHub Release
# (which also creates the tag) is the explicit publish gesture.
#
# Setup checklist (one-time, on PyPI):
#   1. Create / sign in to a PyPI account that should own the
#      ``secscan`` project.
#   2. Account settings → "Publishing" → "Add a new pending
#      publisher" with:
#        - PyPI Project Name: secscan
#        - Owner:             shunsukesuetsugu-prog
#        - Repository name:   secscan
#        - Workflow name:     publish.yml
#        - Environment name:  pypi
#   3. Create the ``pypi`` environment in this repo's GitHub
#      settings (Settings → Environments → New) so the OIDC
#      audience matches.
#   4. Cut a release: ``gh release create vX.Y.Z --generate-notes``
#      — that fires the ``release.published`` event below.

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    name: Build sdist+wheel and publish to PyPI
    runs-on: ubuntu-latest
    # ``environment`` is the OIDC trust anchor — it MUST match
    # the pending-publisher config on PyPI. The reviewer-gate
    # checkbox lets the maintainer cancel a misfired release.
    environment:
      name: pypi
      url: https://pypi.org/project/secscan/
    permissions:
      # Required for Trusted Publisher: GitHub mints a short-
      # lived OIDC token that PyPI exchanges for an upload
      # token. ``contents: read`` is plenty for ``actions/
      # checkout``; we do NOT want ``contents: write`` here.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - name: Publish to PyPI (Trusted Publisher / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No ``password:`` or ``user:`` — auth is the OIDC token
        # minted by ``id-token: write`` above. The action talks
        # to ``https://upload.pypi.org`` by default.
