name: Publish to TestPyPI

# A1: dry-run publisher targeting test.pypi.org. Triggered
# manually via ``workflow_dispatch`` so we can rehearse the full
# Trusted-Publisher dance before cutting a real release.
#
# A successful TestPyPI upload also proves end-to-end:
#   - sdist / wheel build under CI's Linux runner.
#   - twine metadata check.
#   - OIDC trust chain to TestPyPI.
#   - Reverse-install (``pip install --index-url ...
#     https://test.pypi.org/simple/ secscan``) works.
#
# Setup checklist (one-time, on TestPyPI):
#   1. Create / sign in to test.pypi.org (separate account from
#      pypi.org — credentials do NOT cross over).
#   2. Account settings → "Publishing" → "Add a pending publisher":
#        - PyPI Project Name: pysecscan
#        - Owner:             shunsukesuetsugu-prog
#        - Repository name:   secscan
#        - Workflow name:     publish-test.yml
#        - Environment name:  testpypi
#   3. Create the ``testpypi`` environment in this repo (Settings
#      → Environments → New environment → ``testpypi``).
#   4. Run: GitHub → Actions → "Publish to TestPyPI" → Run workflow.

on:
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build sdist+wheel and publish to TestPyPI
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pysecscan/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - name: Publish to TestPyPI (Trusted Publisher / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
