# secscan bundled rule: hard-coded Python credentials in source.
#
# Phase 2-G: the default semgrep registry packs cover credential-
# shaped *string values* (AWS / GitHub / Slack tokens) but do NOT
# fire on generic credential-named variables holding non-trivial
# string literals. ``p/secrets`` is gitleaks-style and matches by
# value shape, missing things like
# ``DB_PASSWORD = "abc123xyz"``.
#
# This rule fires on assignments to credential-named variables
# where the value is a non-empty string literal that is NOT a
# documented placeholder. False-positive surface is bounded by:
#
# - Variable name MUST match a small set of credential keywords
#   (password / passwd / secret / api_key / private_key / token /
#   credential — uppercase, lowercase, or mixed).
# - Names containing ``example`` / ``placeholder`` / ``fake`` /
#   ``test_`` / ``_test`` / ``mock`` / ``dummy`` are excluded.
# - Values like ``""``, ``"changeme"``, ``"your_password_here"``,
#   ``"TODO"`` etc. are excluded.
#
# Nuanced cases (intentional test credentials in tests/) can still
# be suppressed via secscan's baseline or inline ``nosem``.

rules:
  - id: secscan-python-hardcoded-credential
    message: |
      Variable name suggests this holds a credential, and the value
      is a non-trivial string literal. Hard-coding credentials in
      source code is CWE-798: Use of Hard-coded Credentials. Move
      the value to an environment variable, a secrets manager
      (Vault / AWS Secrets Manager / GCP Secret Manager), or a
      gitignored config file.
    severity: WARNING
    languages: [python]
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      category: security
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://owasp.org/www-community/vulnerabilities/Use_of_hard-coded_password
    patterns:
      - pattern: $NAME = "..."
      # Codex Phase 2-G diff review: require the credential keyword
      # to be the FINAL component of the Python identifier so we
      # don't fire on plurals (``passwords_list``), derivatives
      # (``KEY_PASSWORD_HASH``, where the value is the hash, not
      # the password), or contained substrings (``SECRETLY_FUNNY``).
      # ``metavariable-regex`` anchors at the start of the
      # identifier; the keyword anchors at the end via ``$``.
      - metavariable-regex:
          metavariable: $NAME
          regex: '(?i)^(.*_)?(password|passwd|secret|api_?key|private_?key|access_?token|auth_?token|credential)$'
      # Reject names whose stem clearly marks the value as not a
      # real credential (test fixtures, examples, mocks). Codex
      # Phase 2-G diff review broadened the list to include
      # ``sample`` and ``default`` (common in example configs).
      - metavariable-regex:
          metavariable: $NAME
          regex: '^(?i)(?!.*(example|fake|placeholder|mock|dummy|sample|test_|_test|default_|_default)).*$'
      - pattern-not: $NAME = ""
      # Reject values that scream "placeholder" to a human reader.
      - pattern-not-regex: '=\s*"(?i)(changeme|change_me|your_password_here|your[_-]password|your_secret_here|password_here|your_api_key_here|secret_here|please_change|todo|fixme|xxx|placeholder|example|sample|default)"'
