# secscan bundled rule: hard-coded Python credentials in source.
#
# Phase 2-G: the default semgrep registry packs cover credential-
# shaped *string values* (AWS / GitHub / Slack tokens) but do NOT
# fire on generic credential-named variables holding non-trivial
# string literals. ``p/secrets`` is gitleaks-style and matches by
# value shape, missing things like
# ``DB_PASSWORD = "abc123xyz"``.
#
# Phase 2-I (after PyGoat external-bench measurement) broadened
# the pattern set to also catch:
#
#   - attribute assignment ``app.secret_key = "..."`` (Flask / Django)
#   - keyword arguments  ``func(..., password="...", ...)``
#
# Both forms are common in real Python codebases and were missed by
# the Phase 2-G ``$NAME = "..."``-only rule.
#
# False-positive surface is bounded by:
#
# - Identifier MUST match a small set of credential keywords
#   (password / passwd / secret / api_key / private_key / token /
#   credential — uppercase, lowercase, or mixed) at a Python
#   identifier word boundary (FINAL component).
# - Names containing ``example`` / ``placeholder`` / ``fake`` /
#   ``test_`` / ``_test`` / ``mock`` / ``dummy`` / ``sample`` /
#   ``default`` are excluded.
# - Values like ``""``, ``"changeme"``, ``"your_password_here"``,
#   ``"TODO"`` etc. are excluded.
#
# Nuanced cases (intentional test credentials in tests/) can still
# be suppressed via secscan's baseline or inline ``nosem``.

rules:
  - id: secscan-python-hardcoded-credential
    message: |
      Variable name suggests this holds a credential, and the value
      is a non-trivial string literal. Hard-coding credentials in
      source code is CWE-798: Use of Hard-coded Credentials. Move
      the value to an environment variable, a secrets manager
      (Vault / AWS Secrets Manager / GCP Secret Manager), or a
      gitignored config file.
    severity: WARNING
    languages: [python]
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      category: security
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://owasp.org/www-community/vulnerabilities/Use_of_hard-coded_password
    patterns:
      - pattern-either:
          # Module / class / function-body assignment to a bare name.
          - pattern: $NAME = "..."
          # Attribute assignment — ``app.secret_key = "..."`` etc.
          # ``$OBJ`` is unconstrained; the constraint sits on ``$NAME``.
          - pattern: $OBJ.$NAME = "..."
      - metavariable-regex:
          metavariable: $NAME
          regex: '(?i)^(.*_)?(password|passwd|secret|api_?key|private_?key|access_?token|auth_?token|credential)$'
      - metavariable-regex:
          metavariable: $NAME
          regex: '^(?i)(?!.*(example|fake|placeholder|mock|dummy|sample|test_|_test|default_|_default)).*$'
      - pattern-not: $NAME = ""
      - pattern-not: $OBJ.$NAME = ""
      - pattern-not-regex: '=\s*"(?i)(changeme|change_me|your_password_here|your[_-]password|your_secret_here|password_here|your_api_key_here|secret_here|please_change|todo|fixme|xxx|placeholder|example|sample|default)"'

  - id: secscan-python-hardcoded-credential-kwarg
    message: |
      A function is called with a credential-shaped keyword
      argument holding a non-trivial string literal — e.g.
      ``SomeAPI(password="...")`` or ``connect(api_key="...")``.
      Hard-coding credentials in source is CWE-798: move the
      value to an environment variable or a secrets manager.
    severity: WARNING
    languages: [python]
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      category: security
    patterns:
      # Phase 2-I (PyGoat external bench): catches
      # ``sql_lab_table(id="admin", password="abc123")`` —
      # passing a credential as a kwarg. semgrep's
      # ``$F(..., $NAME=..., ...)`` matches a call where any of
      # the keyword args has the named identifier on the LHS.
      - pattern: $F(..., $NAME="...", ...)
      - metavariable-regex:
          metavariable: $NAME
          regex: '(?i)^(.*_)?(password|passwd|secret|api_?key|private_?key|access_?token|auth_?token|credential)$'
      - metavariable-regex:
          metavariable: $NAME
          regex: '^(?i)(?!.*(example|fake|placeholder|mock|dummy|sample|test_|_test|default_|_default)).*$'
      - pattern-not: $F(..., $NAME="", ...)
      - pattern-not-regex: '=\s*"(?i)(changeme|change_me|your_password_here|your[_-]password|your_secret_here|password_here|your_api_key_here|secret_here|please_change|todo|fixme|xxx|placeholder|example|sample|default)"'
