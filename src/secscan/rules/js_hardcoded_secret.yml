# secscan bundled rule: hard-coded JavaScript credentials in source.
#
# Phase 2-I (after NodeGoat external-bench measurement): the JS
# equivalent of ``python_hardcoded_secret.yml``. Mirrors the same
# trade-offs (final-component credential keyword, value not a
# documented placeholder).
#
# Catches the three common Node.js shapes:
#
#   - ``const PASSWORD = "abc123"``               (declaration)
#   - ``module.exports = { dbPassword: "..." }``  (object literal)
#   - ``options.apiKey = "..."``                  (attribute assignment)

rules:
  - id: secscan-js-hardcoded-credential
    message: |
      Variable / property name suggests this holds a credential,
      and the value is a non-trivial string literal. Hard-coding
      credentials in source is CWE-798: Use of Hard-coded
      Credentials. Move the value to an environment variable
      (``process.env.X``), a secrets manager, or a gitignored
      config file.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      category: security
      references:
        - https://cwe.mitre.org/data/definitions/798.html
    patterns:
      - pattern-either:
          # const / let / var declaration
          - pattern: const $NAME = "..."
          - pattern: let $NAME = "..."
          - pattern: var $NAME = "..."
          # plain assignment to a bare name
          - pattern: $NAME = "..."
          # attribute / property assignment
          - pattern: $OBJ.$NAME = "..."
          # object-literal property
          - pattern: |
              { ..., $NAME: "...", ... }
      - metavariable-regex:
          metavariable: $NAME
          regex: '(?i)^(.*_)?(password|passwd|secret|apiKey|api_?key|privateKey|private_?key|accessToken|access_?token|authToken|auth_?token|credential)$'
      - metavariable-regex:
          metavariable: $NAME
          regex: '^(?i)(?!.*(example|fake|placeholder|mock|dummy|sample|test_|_test|default_|_default)).*$'
      - pattern-not-regex: ':\s*""'
      - pattern-not-regex: '=\s*""'
      - pattern-not-regex: '"(?i)(changeme|change_me|your_password_here|your[_-]password|your_secret_here|password_here|your_api_key_here|secret_here|please_change|todo|fixme|xxx|placeholder|example|sample|default)"'
