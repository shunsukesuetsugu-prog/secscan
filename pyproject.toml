[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# PyPI *distribution* name = ``shun-secscan``. The CLI command
# and Python import name stay as ``secscan`` (see
# [project.scripts] and src/secscan/). PyPI's typo-squat /
# name-policy gate blocked both the bare ``secscan`` and the
# ``py-`` prefix variant on pypi.org (an unrelated
# ``secscan-cli`` package from a different author is close
# enough in normalized form to trigger the similarity check),
# so we ship under a personal namespace using the
# maintainer's ``shun-`` prefix.
name = "shun-secscan"
version = "0.21.0"
description = "Cross-project vulnerability scanning CLI: dependency CVE, SAST, secrets, DAST, IAST, container, SBOM, API fuzz, and supply chain integrity — one entry point."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "secscan maintainers" }]
keywords = [
    "security", "vulnerability", "scanner", "sast", "dast", "iast",
    "sbom", "cve", "secrets", "supply-chain", "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    # PyYAML is needed by ``discover.py`` to parse pnpm-workspace.yaml when
    # the user has a pnpm monorepo. It's small (no compiled C deps on
    # platforms without libyaml) so we keep it as a hard dependency rather
    # than gating monorepo support behind an extra.
    "PyYAML>=6.0",
    # Phase 2-W: cross-platform process management for the IAST
    # harness (Phase 2-P). The POSIX-only ``os.killpg`` /
    # ``signal.SIGKILL`` path is replaced by ``psutil`` which
    # gives us a uniform process-tree walk on Linux / macOS /
    # Windows. psutil is the de facto cross-platform standard;
    # the alternative (subprocess-spawned ``taskkill /F /T``) is
    # SIGKILL-equivalent only and loses the graceful POSIX
    # SIGTERM step.
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/shunsukesuetsugu-prog/secscan"
Repository = "https://github.com/shunsukesuetsugu-prog/secscan"
Issues = "https://github.com/shunsukesuetsugu-prog/secscan/issues"
Changelog = "https://github.com/shunsukesuetsugu-prog/secscan/releases"

[project.optional-dependencies]
# Phase 1C will register the sast scanner; install secscan[sast] to bring in
# semgrep. Keeping it as an extra lets users pick what they need (and avoids
# pulling a heavy graph for users who only want secrets).
sast = ["semgrep>=1.50"]

# Phase 1B will register the deps scanner for the PyPI ecosystem; install
# secscan[deps] for pip-audit. (npm/pnpm dependencies are not Python
# packages, so they remain a pre-install requirement.)
deps = ["pip-audit>=2.7"]

# Convenience meta-extra.
all = ["semgrep>=1.50", "pip-audit>=2.7"]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # Phase 2-A: SARIF schema validation in tests.
    "jsonschema>=4.20",
    # Phase 2-B: mypy stubs for PyYAML.
    "types-PyYAML>=6.0",
    # Phase 2-W: psutil mypy stubs for strict typing.
    "types-psutil>=7.0",
    # During Phase 1A development we want both scanners' tools available so
    # the dev environment can be linted / type-checked / smoke-run end-to-end.
    "semgrep>=1.50",
    "pip-audit>=2.7",
]

[project.scripts]
secscan = "secscan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/secscan"]
# Phase 2-G: ship the bundled semgrep rules with the wheel so
# ``secscan:extra`` resolves to a real path after a clean pip
# install. Hatch picks up non-Python files (.yml rules) when
# they live under a packaged directory, so no explicit
# ``force-include`` is needed — that addition would have
# duplicated every rule file in the wheel (UserWarning at
# build time).

[tool.hatch.build.targets.sdist]
# A1: keep the published sdist focused on what end users actually
# need. ``bench/`` contains synthetic-vulnerable fixtures and
# external corpora (gitleaks-corpus, nodegoat, dvwa-modern, ...)
# that would balloon the sdist to ~2 MB and aren't useful for
# anyone installing via ``pip install secscan``.
include = [
    "src/secscan",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]
exclude = [
    "bench",
    "tests",
    ".github",
    ".venv",
    "dist",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# bench/fixtures/ contains intentionally-vulnerable code used to
# measure detection rates. Linting it produces noise (and would
# arguably defeat the purpose). Skip it.
extend-exclude = ["bench/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that invoke real external OSS tools (slow, may be skipped in CI)",
]
