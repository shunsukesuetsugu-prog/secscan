[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secscan"
version = "0.1.0"
description = "Cross-project vulnerability scanning CLI: dependency CVE, SAST, and secrets in one entry point."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "secscan maintainers" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    # SAST: semgrep is a Python package and ships its CLI.
    "semgrep>=1.50",
    # Python dependency CVE scanner.
    "pip-audit>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
secscan = "secscan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/secscan"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that invoke real external OSS tools (slow, may be skipped in CI)",
]
