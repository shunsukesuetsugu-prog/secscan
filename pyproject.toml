[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secscan"
version = "0.19.0"
description = "Cross-project vulnerability scanning CLI: dependency CVE, SAST, and secrets in one entry point."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "secscan maintainers" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    # PyYAML is needed by ``discover.py`` to parse pnpm-workspace.yaml when
    # the user has a pnpm monorepo. It's small (no compiled C deps on
    # platforms without libyaml) so we keep it as a hard dependency rather
    # than gating monorepo support behind an extra.
    "PyYAML>=6.0",
    # Phase 2-W: cross-platform process management for the IAST
    # harness (Phase 2-P). The POSIX-only ``os.killpg`` /
    # ``signal.SIGKILL`` path is replaced by ``psutil`` which
    # gives us a uniform process-tree walk on Linux / macOS /
    # Windows. psutil is the de facto cross-platform standard;
    # the alternative (subprocess-spawned ``taskkill /F /T``) is
    # SIGKILL-equivalent only and loses the graceful POSIX
    # SIGTERM step.
    "psutil>=5.9",
]

[project.optional-dependencies]
# Phase 1C will register the sast scanner; install secscan[sast] to bring in
# semgrep. Keeping it as an extra lets users pick what they need (and avoids
# pulling a heavy graph for users who only want secrets).
sast = ["semgrep>=1.50"]

# Phase 1B will register the deps scanner for the PyPI ecosystem; install
# secscan[deps] for pip-audit. (npm/pnpm dependencies are not Python
# packages, so they remain a pre-install requirement.)
deps = ["pip-audit>=2.7"]

# Convenience meta-extra.
all = ["semgrep>=1.50", "pip-audit>=2.7"]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # Phase 2-A: SARIF schema validation in tests.
    "jsonschema>=4.20",
    # Phase 2-B: mypy stubs for PyYAML.
    "types-PyYAML>=6.0",
    # Phase 2-W: psutil mypy stubs for strict typing.
    "types-psutil>=7.0",
    # During Phase 1A development we want both scanners' tools available so
    # the dev environment can be linted / type-checked / smoke-run end-to-end.
    "semgrep>=1.50",
    "pip-audit>=2.7",
]

[project.scripts]
secscan = "secscan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/secscan"]
# Phase 2-G: ship the bundled semgrep rules with the wheel so
# ``secscan:extra`` resolves to a real path after a clean pip install.
# Hatch picks up non-Python files when they live under a packaged
# directory, but we make the include explicit so a future rename
# of ``src/secscan/rules`` doesn't silently drop the rules from
# wheels.
[tool.hatch.build.targets.wheel.force-include]
"src/secscan/rules" = "secscan/rules"

[tool.ruff]
line-length = 100
target-version = "py311"
# bench/fixtures/ contains intentionally-vulnerable code used to
# measure detection rates. Linting it produces noise (and would
# arguably defeat the purpose). Skip it.
extend-exclude = ["bench/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that invoke real external OSS tools (slow, may be skipped in CI)",
]
